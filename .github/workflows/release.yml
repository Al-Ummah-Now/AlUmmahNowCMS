name: Release

# Stage-then-promote, modelled on AlUmmahNowAuth (docs/PLAN.md "Release mechanics"):
#   resolve (tag on main?) → build once → stage (migrate, promote rehearsal, E2E) → production
#   (tag-still-here guard, secrets check, migrate expand-only, candidate at 0 % + override smoke, 100 %, smoke,
#   auto-rollback) → rollback dry run.
# When production moves is decided by a tag (monorepo CLAUDE.md "Deploy Rules"):
#   - push a tag vYYYY.MM.DD (vYYYY.MM.DD.N, N >= 2, for a later release that day) on a commit on
#     main -> stage -> stage E2E -> production. Merging to main deploys QA only (deploy-qa.yml).
#   - workflow_dispatch on main -> stage and stage E2E only; it never touches production.
# A tag with a bad name, or on a commit that is not on main, is refused before anything deploys.
# To re-run a failed release, re-run that tag's workflow run; never move a tag.
# Repo settings this relies on: the stage environment allows main and v* tags, production allows
# v* tags only, and a tag ruleset restricts who may create v* tags.
# Rollback: .github/workflows/rollback.yml or `npm run release:rollback -- --env production`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancel one half-way through a promote.
concurrency:
  group: cms-release
  cancel-in-progress: false

env:
  # The tagged commit (tag push) or main's head (dispatch).
  RELEASE_SHA: ${{ github.sha }}

# The Cloudflare token is set only on the steps that call Cloudflare, never on install/build
# steps (dependency lifecycle scripts run there).
jobs:
  # Decides what this run is: a tag release (stage -> production) or a stage-only run from main.
  # Refuses anything else before a single build minute is spent.
  resolve:
    name: Resolve release (tag on main?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.kind.outputs.tag }}
      production: ${{ steps.kind.outputs.production }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all tags and origin/main, for the ancestry check and the changelog

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Tag release or stage-only run?
        id: kind
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            { echo "tag=$GITHUB_REF_NAME"; echo "production=true"; } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "### Stage-only run of main@${GITHUB_SHA::7}. Production is released by pushing a tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Releases run from a tag (production) or from main (stage only), not from $GITHUB_REF."
            exit 1
          fi

      - name: Valid tag on main?
        id: check
        if: steps.kind.outputs.production == 'true'
        run: node --experimental-strip-types --no-warnings scripts/release/release-tag.ts check "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Changes in this release
        if: steps.kind.outputs.production == 'true'
        env:
          PREV: ${{ steps.check.outputs.previous }}
        run: |
          {
            echo "### Release $GITHUB_REF_NAME (${GITHUB_SHA::7})"
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"; echo '```'; git log --oneline --no-decorate "$PREV..$GITHUB_SHA"; echo '```'
            else
              echo "First tagged release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build once
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run check:schema
          npm run check:config

      # One bundle per env (vars differ, code does not); the same files go to stage and production.
      - name: Bundle (wrangler deploy --dry-run)
        run: npm run build:dry

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          retention-days: 30

  stage:
    name: Stage (migrate, promote, E2E)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: stage
      url: https://cms.stage.alummahnow.net
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/

      - name: Secrets check (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/check-secrets.ts --env stage

      - name: Migrate stage D1 (expand-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --env stage

      # Same mechanics as production, so every release also rehearses the promote.
      - name: Promote on stage (0 % + override smoke → 100 % → smoke)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/promote.ts --env stage --message "release ${RELEASE_SHA}"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E on stage
        env:
          CMS_URL: https://cms.stage.alummahnow.net
          AUTH_URL: https://auth.stage.alummahnow.net
          CMS_CLIENT_ID: d06fd65a-5b79-45bc-8bfd-a856b8502330
          WWW_URL: https://www.stage.alummahnow.net
          SEED_PASSWORD: ${{ secrets.STAGE_SEED_PASSWORD }}
        run: npx playwright test

      # Screenshots and the release result only: Playwright traces and reports of the signed-in
      # suite hold session cookies, so they are never uploaded (trace is off in CI anyway).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-e2e
          path: |
            e2e-artifacts/
            release-result.json
          if-no-files-found: ignore
          retention-days: 7

  production:
    name: Production (migrate, 0% smoke, promote)
    needs: [resolve, stage]
    if: needs.resolve.outputs.production == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://cms.alummahnow.net
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      # The release deploys exactly the tagged commit, so later merges to main don't matter. A tag
      # that was deleted or moved while stage ran is not promoted.
      - name: Tag still points at this commit?
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          now=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$now" ] || now=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ "$now" != "$RELEASE_SHA" ]; then
            echo "::error::$TAG now points at '${now::7}', not ${RELEASE_SHA::7}; not promoting. Tags are never moved: cut a new tag."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/

      - name: Secrets check (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/check-secrets.ts --env production

      # Expand-only (migration guard in CI), so the version still serving keeps working and a
      # rollback never needs to undo a migration.
      # Compared with the commit production last released (from the Cloudflare deployment
      # history), not HEAD^, so every migration since then is checked. First release: no base,
      # the destructive-SQL rules still apply to every file.
      - name: Migration guard (vs the last production release)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          last=$(node --experimental-strip-types --no-warnings scripts/release/last-released.ts --env production)
          if [ -z "$last" ]; then
            base=4b825dc642cb6eb9a060e54bf8d69288fbee4904  # git's empty tree
          elif git merge-base --is-ancestor "$last" "$RELEASE_SHA"; then
            base=$last
          else
            echo "::error::production runs ${last::7}, which is not an ancestor of ${RELEASE_SHA::7}"; exit 1
          fi
          CLOUDFLARE_API_TOKEN= node --experimental-strip-types --no-warnings scripts/migration-guard.ts --base "$base"

      - name: Migrate production D1 (expand-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --env=""

      - name: Promote (0 % + override smoke → 100 % → smoke, auto-rollback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/promote.ts --env production --message "release ${RELEASE_SHA}"

      - name: Summary
        if: always()
        run: |
          if [ -f release-result.json ]; then
            { echo '### Production release'; echo '```json'; cat release-result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-result
          path: release-result.json
          if-no-files-found: ignore
          retention-days: 90

  rollback-dry-run:
    name: Rollback dry run
    needs: production
    runs-on: ubuntu-24.04
    # Uses the production-scoped Cloudflare token, so it runs under the production environment.
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: release-result

      # Resolves the version a rollback would deploy and prints the command; moves no traffic.
      # (A first release has no previous version; the dry run then resolves from the history.)
      - name: Rollback dry run (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node --experimental-strip-types --no-warnings scripts/release/rollback.ts --env production --from-result release-result.json --dry-run | tee rollback-dry-run.txt
          status=${PIPESTATUS[0]}
          { echo '### Rollback dry run'; echo '```'; cat rollback-dry-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '"firstDeploy": true' release-result.json; then exit 0; fi
          exit "$status"
