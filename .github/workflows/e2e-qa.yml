name: E2E (QA)

# Playwright against the deployed QA CMS. Called by deploy-qa.yml after every QA deploy;
# can also be run by hand.
on:
  workflow_call:
    secrets:
      QA_SEED_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      browsers:
        description: "chromium (desktop + phone) or all (adds Firefox and WebKit, desktop + phone)"
        type: choice
        options: [chromium, all]
        default: chromium
      gallery:
        description: "Also screenshot every staff screen in every theme, mode and language"
        type: boolean
        default: false

permissions:
  contents: read

# Runs share the E2E accounts (auth throttles sign-ins per email): never two at once.
concurrency:
  group: cms-e2e-qa
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright vs QA
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.gallery && 60 || 25 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Playwright
        uses: ./.github/actions/playwright-install
        with:
          runner: npx
          browsers: ${{ inputs.browsers == 'all' && 'chromium firefox webkit' || 'chromium' }}
      - name: E2E
        env:
          CMS_URL: https://cms.qa.alummahnow.net
          AUTH_URL: https://auth.qa.alummahnow.net
          CMS_CLIENT_ID: 0e613f49-674b-490a-93e5-97a35d586da1
          WWW_URL: https://www.qa.alummahnow.net
          QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}
          E2E_BROWSERS: ${{ inputs.browsers }}
        run: npx playwright test

      # Read-only on content (it creates and removes its own sample page and post), so projects run in parallel.
      - name: Screenshot gallery
        if: ${{ inputs.gallery && !cancelled() }}
        env:
          CMS_URL: https://cms.qa.alummahnow.net
          AUTH_URL: https://auth.qa.alummahnow.net
          CMS_CLIENT_ID: 0e613f49-674b-490a-93e5-97a35d586da1
          QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}
          E2E_BROWSERS: ${{ inputs.browsers }}
          E2E_GALLERY: '1'
        run: npx playwright test e2e/gallery.spec.ts --workers=6

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-qa
          # Screenshots only: traces/reports of the signed-in suite hold session cookies.
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
