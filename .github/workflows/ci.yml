name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No Cloudflare credentials here: everything runs locally (miniflare, local D1, dry-run bundles).
jobs:
  checks:
    name: Lint, typecheck, tests, schema, guard, bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the migration guard compares with origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generated files are current (admin client bundle, vendored Fanous themes)
        run: npm run check:client && npm run check:fanous

      - name: Unit and Workers-runtime tests
        run: npm test

      - name: Schema check (migrations == src/schema.ts)
        run: npm run check:schema

      - name: Migration guard (expand-only, append-only)
        run: node --experimental-strip-types --no-warnings scripts/migration-guard.ts --base origin/main

      - name: wrangler.jsonc check
        run: npm run check:config

      - name: Bundle every env (wrangler deploy --dry-run)
        run: npm run build:dry

  # AI writing assist editor flows (docs/AI_ASSIST_SPEC.md §9): wrangler dev (local D1, R2, queues) with a
  # mock auth issuer and a mock Workers AI. No Cloudflare credentials, no real accounts.
  e2e-local:
    name: E2E (local, mocked Workers AI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (desktop + phone, en/ar, light/dark, axe)
        run: npx playwright test -c playwright.local.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-local
          path: |
            e2e-artifacts/
            playwright-report-local/
          if-no-files-found: ignore
          retention-days: 14
